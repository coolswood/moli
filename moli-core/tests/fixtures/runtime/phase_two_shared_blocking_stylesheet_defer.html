<!doctype html>
<html>
  <head>
    <script>
      window.sharedBlockingDeferOrder = [];
      window.sharedBlockingDeferStylesReady = true;
      window.sharedBlockingDeferOrder.push = function(value) {
        if (value === "defer-left" || value === "defer-right") {
          window.sharedBlockingDeferStylesReady &&=
            getComputedStyle(document.body).color === "rgb(1, 2, 3)";
        }
        return Array.prototype.push.call(this, value);
      };
      window.deferLikeOrder = window.sharedBlockingDeferOrder;
      document.addEventListener("DOMContentLoaded", () => {
        window.sharedBlockingDeferOrder.push("dcl");
        window.sharedBlockingDeferOrderResult =
          window.sharedBlockingDeferOrder.join(",");
      });
    </script>
    <link rel="stylesheet" href="/assets/blocking_stylesheet_slow.css?shared=defer">
    <script defer src="/assets/parse_time_defer_left.js"></script>
    <script defer src="/assets/parse_time_defer_right.js"></script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
